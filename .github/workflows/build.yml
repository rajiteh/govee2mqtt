name: Personal CA trust integration

on:
  push:
    branches: [integration/ca-trust-ghcr]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ca-trust-integration
  cancel-in-progress: false

jobs:
  compile:
    if: github.repository == 'rajiteh/govee2mqtt' && github.ref == 'refs/heads/integration/ca-trust-ghcr'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Install pinned cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Build the checked-out fork with its lockfile
        run: ./scripts/build-cross.sh "${{ matrix.platform }}"
      - name: Stage this binary and source assets for the add-on
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          git diff --exit-code -- Cargo.lock
          mkdir -p addon/app
          cp "docker-target/$PLATFORM/govee" addon/app/govee
          cp -a assets addon/app/assets
          cp AmazonRootCA1.pem addon/app/AmazonRootCA1.pem
          printf '%s\n' "$GITHUB_SHA" > addon/app/source-revision
          (cd addon/app && sha256sum govee > govee.sha256)
          sha256sum Cargo.lock > addon/app/Cargo.lock.sha256
          cat addon/app/govee.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: govee-${{ matrix.arch }}-${{ github.sha }}
          path: addon/app/
          if-no-files-found: error
          retention-days: 7

  addon:
    if: github.repository == 'rajiteh/govee2mqtt' && github.ref == 'refs/heads/integration/ca-trust-ghcr'
    needs: compile
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: govee-${{ matrix.arch }}-${{ github.sha }}
          path: addon/app/
      - name: Verify the compiled artifact belongs to this source revision
        run: |
          set -eu
          test "$(cat addon/app/source-revision)" = "$GITHUB_SHA"
          (cd addon/app && sha256sum -c govee.sha256)
          sha256sum -c addon/app/Cargo.lock.sha256
          chmod 0755 addon/app/govee
      - name: Read the reviewed image and base configuration
        id: config
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          python3 -m venv "$RUNNER_TEMP/govee-config"
          "$RUNNER_TEMP/govee-config/bin/pip" install --disable-pip-version-check PyYAML==6.0.3
          "$RUNNER_TEMP/govee-config/bin/python" - <<'PYCONFIG'
          import os, yaml
          from pathlib import Path
          config = yaml.safe_load(Path('addon/config.yaml').read_text())
          build = yaml.safe_load(Path('addon/build.yaml').read_text())
          arch = os.environ['ARCH']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('image=' + config['image'].replace('{arch}', arch), file=output)
              print('version=' + config['version'], file=output)
              print('base=' + build['build_from'][arch], file=output)
          PYCONFIG
      - name: Build and sign the personal add-on image
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: addon
          image: ${{ steps.config.outputs.image }}
          image-tags: ${{ steps.config.outputs.version }}
          version: ${{ steps.config.outputs.version }}
          skip-existing: ${{ steps.config.outputs.version }}
          container-registry-username: rajiteh
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          push: "true"
          cosign: "true"
          cosign-base-verify: ${{ steps.config.outputs.base }}
          cosign-base-identity: https://github.com/home-assistant/docker-base/.*
          cosign-identity: '^https://github\.com/rajiteh/govee2mqtt/\.github/workflows/build\.yml@refs/heads/integration/ca-trust-ghcr$'
          cache-gha: "false"
          cache-image-tag: ${{ steps.config.outputs.version }}
          build-args: |
            BUILD_FROM=${{ steps.config.outputs.base }}
          labels: |
            org.opencontainers.image.title=Home Assistant Add-on: Govee to MQTT Bridge
            org.opencontainers.image.description=Acts as a bridge between Govee devices and Home Assistant, via the Home Assistant MQTT Integration.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
